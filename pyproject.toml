[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repocodex"
version = "0.0.1"
description = "Repository-native executable memory for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ajay Lamba" }]
dependencies = [
    "typer>=0.27.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/azaylamba/repocodex"
Source = "https://github.com/azaylamba/repocodex"
Issues = "https://github.com/azaylamba/repocodex/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.12.0",
]
mcp = [
    "mcp>=2.1.1",
]

[project.scripts]
repocodex = "repocodex.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repocodex = ["data/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/test_*.py" = ["D101", "D102", "D103"]
