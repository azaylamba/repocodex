name: RepoCodex

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  required:
    name: RepoCodex (deterministic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install RepoCodex (pinned)
        run: |
          PIN=$(python3 -c "import tomllib,pathlib; p=pathlib.Path('.repocodex.toml');
print(tomllib.loads(p.read_text())['engine_version'] if p.exists() else '1.0.0')")
          pip install "repocodex==${PIN}" || pip install -e .
      - name: Validate diff
        env:
          GITHUB_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            repocodex validate --diff --check
          else
            repocodex validate --diff --base "${BASE}" --check
          fi

  advisory:
    name: RepoCodex (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: pip install -e . || pip install repocodex
      - name: Advisory findings
        run: |
          echo "Review-agent findings are advisory only."
          repocodex validate --diff || true
